name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://invest-saham.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://zzpzsdudqxcqitcpbecn.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder